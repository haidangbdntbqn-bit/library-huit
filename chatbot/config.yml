# Cấu hình pipeline NLU + chính sách hội thoại cho tiếng Việt.
# Tiếng Việt tách từ bằng khoảng trắng theo âm tiết, nên dùng thêm
# CountVectorsFeaturizer theo n-gram ký tự để bắt được từ ghép.
recipe: default.v1
language: vi
assistant_id: tro-ly-thu-vien-huit

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 150
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: FallbackClassifier
    threshold: 0.45
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
